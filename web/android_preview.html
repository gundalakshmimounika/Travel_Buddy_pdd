<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBuddy - Android Application (Pixel 7)</title>
  <link rel="icon" type="image/png" href="assets/ic_app_logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg-dark: #0B1118;
      --card-bg: #141C26;
      --accent-blue: #2563EB;
      --accent-cyan: #06B6D4;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Top Navigation Banner */
    .top-banner {
      width: 100%;
      background: linear-gradient(90deg, #0F172A, #1E293B);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .tag-android {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .backend-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #10B981;
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .backend-pill .dot {
      width: 8px;
      height: 8px;
      background-color: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10B981;
    }

    .btn-switch {
      background: var(--accent-blue);
      color: #FFFFFF;
      text-decoration: none;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-switch:hover {
      background: #1D4ED8;
      transform: translateY(-1px);
    }

    /* Device Container */
    .device-wrapper {
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    /* Pixel 7 Smartphone Frame */
    .phone-frame {
      width: 412px;
      height: 860px;
      background: #10151C;
      border-radius: 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8),
                  0 0 0 12px #1E293B,
                  0 0 0 14px #334155,
                  0 0 40px rgba(37, 99, 235, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Camera Hole Punch & Speaker */
    .phone-top-bar {
      height: 38px;
      width: 100%;
      background: #0B1118;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 22px;
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .camera-punch {
      width: 12px;
      height: 12px;
      background: #000000;
      border: 2px solid #1E293B;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    /* Inner Iframe */
    .phone-screen {
      flex: 1;
      width: 100%;
      border: none;
      background: #0B1118;
    }

    /* Bottom Android Navigation Bar */
    .phone-bottom-bar {
      height: 24px;
      width: 100%;
      background: #0B1118;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .home-pill {
      width: 120px;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Banner -->
  <header class="top-banner">
    <div class="brand-section">
      <img src="assets/ic_app_logo.png" class="brand-logo" alt="TravelBuddy">
      <h1 class="brand-title">TravelBuddy</h1>
      <span class="tag-android">Android App</span>
    </div>

    <div class="nav-actions">
      <div class="backend-pill">
        <span class="dot"></span>
        <span>Unified Backend Active (Port 80 / 8000)</span>
      </div>
      <a href="index.html" class="btn-switch" target="_blank">
        💻 Open Web App in New Tab →
      </a>
    </div>
  </header>

  <!-- Device Display Area -->
  <main class="device-wrapper">
    <div class="phone-frame">
      <!-- Phone Header Bar -->
      <div class="phone-top-bar">
        <span id="phone-clock">10:00</span>
        <div class="camera-punch"></div>
        <div class="status-icons">
          <span>5G</span>
          <span>📶</span>
          <span>🔋 98%</span>
        </div>
      </div>

      <!-- Live Interactive Screen -->
      <iframe src="index.html" class="phone-screen" title="TravelBuddy Android App Screen"></iframe>

      <!-- Phone Bottom Home Indicator -->
      <div class="phone-bottom-bar">
        <div class="home-pill"></div>
      </div>
    </div>
  </main>

  <script>
    // Live Clock for Phone Status Bar
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      hours = hours % 12 || 12;
      document.getElementById('phone-clock').textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 30000);
  </script>
</body>
</html>
